name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests benchmarks
          ruff format --check src tests benchmarks
      - name: Type check
        run: mypy src/spx_pipeline --ignore-missing-imports --exclude vendors
      - name: Tests
        run: pytest
      - name: End-to-end demo on synthetic data
        run: spx-pipeline demo
